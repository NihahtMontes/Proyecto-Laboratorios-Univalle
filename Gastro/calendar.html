<!DOCTYPE html>
<html dir="ltr" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Gastro - Calendario de Eventos">
    <title>Gastro - Calendario</title>

    <!-- ============================================================== -->
    <!-- Iconos (Font Awesome + Themify + Material Design Icons)        -->
    <!-- Sin esto los íconos aparecen como cuadros □                    -->
    <!-- ============================================================== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/themify-icons@0.1.2/css/themify-icons.css">
    <link rel="stylesheet" href="https://cdn.materialdesignicons.com/2.0.46/css/materialdesignicons.min.css">

    <!-- ============================================================== -->
    <!-- CSS Específicos del Calendario                                  -->
    <!-- ============================================================== -->
    <link href="assets/libs/fullcalendar/dist/fullcalendar.min.css" rel="stylesheet" />
    <link href="assets/extra-libs/calendar/calendar.css" rel="stylesheet" />

    <!-- ============================================================== -->
    <!-- CSS Base del Template (Bootstrap + Utilidades Nice Admin)       -->
    <!-- ============================================================== -->
    <link href="dist/css/style.min.css" rel="stylesheet">
</head>

<body>
    <!-- ============================================================== -->
    <!-- Preloader                                                       -->
    <!-- ============================================================== -->
    <div class="preloader">
        <div class="lds-ripple">
            <div class="lds-pos"></div>
            <div class="lds-pos"></div>
        </div>
    </div>

    <!-- ============================================================== -->
    <!-- Main wrapper                                                    -->
    <!-- ============================================================== -->
    <div id="main-wrapper">

        <!-- ============================================================== -->
        <!-- NAVBAR / TOPBAR — Reemplazar con el tuyo si ya lo tienes       -->
        <!-- ============================================================== -->
        <header class="topbar">
            <nav class="navbar top-navbar navbar-expand-md navbar-dark">
                <div class="navbar-header">
                    <div class="navbar-brand">
                        <a href="index.html" class="logo">
                            <b class="logo-icon">
                                <img src="assets/images/logo-icon.png" alt="Gastro" class="dark-logo" />
                                <img src="assets/images/logo-light-icon.png" alt="Gastro" class="light-logo" />
                            </b>
                            <span class="logo-text">
                                <img src="assets/images/logo-text.png" alt="Gastro" class="dark-logo" />
                                <img src="assets/images/logo-light-text.png" class="light-logo" alt="Gastro" />
                            </span>
                        </a>
                    </div>
                </div>
            </nav>
        </header>

        <!-- ============================================================== -->
        <!-- SIDEBAR — Reemplazar con el tuyo si ya lo tienes              -->
        <!-- ============================================================== -->
        <aside class="left-sidebar">
            <div class="scroll-sidebar">
                <nav class="sidebar-nav">
                    <ul id="sidebarnav">
                        <li class="nav-small-cap">
                            <i class="mdi mdi-dots-horizontal"></i>
                            <span class="hide-menu">Menú</span>
                        </li>
                        <li class="sidebar-item active">
                            <a href="calendar.html" class="sidebar-link waves-effect waves-dark" aria-expanded="false">
                                <i class="mdi mdi-calendar-range"></i>
                                <span class="hide-menu">Calendario</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- ============================================================== -->
        <!-- Page wrapper — AQUÍ VIVE TODO EL CONTENIDO VISUAL             -->
        <!-- ============================================================== -->
        <div class="page-wrapper">

            <!-- Breadcrumb -->
            <div class="page-breadcrumb">
                <div class="row">
                    <div class="col-5 align-self-center">
                        <h4 class="page-title">Calendario</h4>
                    </div>
                    <div class="col-7 align-self-center">
                        <div class="d-flex align-items-center justify-content-end">
                            <nav aria-label="breadcrumb">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item"><a href="#">Home</a></li>
                                    <li class="breadcrumb-item active" aria-current="page">Calendario</li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============================================================== -->
            <!-- Container fluid — CUERPO DEL CALENDARIO                       -->
            <!-- ============================================================== -->
            <div class="container-fluid">
                <div class="row">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="">
                                <div class="row">
                                    <!-- ============================== -->
                                    <!-- Panel Lateral: Drag & Drop     -->
                                    <!-- ============================== -->
                                    <div class="col-lg-3 border-right p-r-0">
                                        <div class="card-body border-bottom">
                                            <h4 class="card-title m-t-10">Drag &amp; Drop Event</h4>
                                        </div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <!-- Eventos arrastrables -->
                                                    <div id="calendar-events" class="">
                                                        <div class="calendar-events m-b-20" data-class="bg-info">
                                                            <i class="fa fa-circle text-info m-r-10"></i>Event One
                                                        </div>
                                                        <div class="calendar-events m-b-20" data-class="bg-success">
                                                            <i class="fa fa-circle text-success m-r-10"></i>Event Two
                                                        </div>
                                                        <div class="calendar-events m-b-20" data-class="bg-danger">
                                                            <i class="fa fa-circle text-danger m-r-10"></i>Event Three
                                                        </div>
                                                        <div class="calendar-events m-b-20" data-class="bg-warning">
                                                            <i class="fa fa-circle text-warning m-r-10"></i>Event Four
                                                        </div>
                                                    </div>
                                                    <!-- Checkbox: Eliminar después de soltar -->
                                                    <div class="custom-control custom-checkbox">
                                                        <input type="checkbox" class="custom-control-input" id="drop-remove">
                                                        <label class="custom-control-label" for="drop-remove">Remove after drop</label>
                                                    </div>
                                                    <!-- Botón: Agregar nuevo evento -->
                                                    <a href="javascript:void(0)" data-toggle="modal"
                                                        data-target="#add-new-event"
                                                        class="btn m-t-20 btn-info btn-block waves-effect waves-light">
                                                        <i class="ti-plus"></i> Add New Event
                                                    </a>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- ============================== -->
                                    <!-- Área principal del Calendario  -->
                                    <!-- ============================== -->
                                    <div class="col-lg-9">
                                        <div class="card-body b-l calender-sidebar">
                                            <!-- FullCalendar se inyecta aquí mediante cal-init.js -->
                                            <div id="calendar"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ============================================================== -->
                <!-- MODAL: Editar / Eliminar evento al hacer clic                  -->
                <!-- ============================================================== -->
                <div class="modal none-border" id="my-event">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h4 class="modal-title"><strong>Add Event</strong></h4>
                                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                            </div>
                            <div class="modal-body"></div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary waves-effect" data-dismiss="modal">Close</button>
                                <button type="button" class="btn btn-success save-event waves-effect waves-light">Create event</button>
                                <button type="button" class="btn btn-danger delete-event waves-effect waves-light" data-dismiss="modal">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ============================================================== -->
                <!-- MODAL: Agregar nueva categoría de evento                       -->
                <!-- ============================================================== -->
                <div class="modal fade none-border" id="add-new-event">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h4 class="modal-title"><strong>Add</strong> a category</h4>
                                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                            </div>
                            <div class="modal-body">
                                <form>
                                    <div class="row">
                                        <div class="col-md-6">
                                            <label class="control-label">Category Name</label>
                                            <input class="form-control form-white" placeholder="Enter name" type="text" name="category-name" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="control-label">Choose Category Color</label>
                                            <select class="form-control form-white" data-placeholder="Choose a color..." name="category-color">
                                                <option value="success">Success</option>
                                                <option value="danger">Danger</option>
                                                <option value="info">Info</option>
                                                <option value="primary">Primary</option>
                                                <option value="warning">Warning</option>
                                            </select>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-danger waves-effect waves-light save-category" data-dismiss="modal">Save</button>
                                <button type="button" class="btn btn-secondary waves-effect" data-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            <!-- Fin container-fluid -->
        </div>
        <!-- Fin page-wrapper -->

    </div>
    <!-- Fin main-wrapper -->

    <!-- ============================================================== -->
    <!-- SCRIPTS — Orden de carga OBLIGATORIO                           -->
    <!-- ============================================================== -->

    <!-- 1. jQuery Core -->
    <script src="assets/libs/jquery/dist/jquery.min.js"></script>

    <!-- 2. jQuery UI (necesario para Drag & Drop del calendario) -->
    <script src="assets/extra-libs/taskboard/js/jquery.ui.touch-punch-improved.js"></script>
    <script src="assets/extra-libs/taskboard/js/jquery-ui.min.js"></script>

    <!-- 3. Bootstrap -->
    <script src="assets/libs/popper.js/dist/umd/popper.min.js"></script>
    <script src="assets/libs/bootstrap/dist/js/bootstrap.min.js"></script>

    <!-- 4. Framework Nice Admin -->
    <script src="dist/js/app.min.js"></script>
    <script src="dist/js/app.init.js"></script>
    <script src="dist/js/app-style-switcher.js"></script>
    <script src="assets/libs/perfect-scrollbar/dist/perfect-scrollbar.jquery.min.js"></script>
    <script src="assets/extra-libs/sparkline/sparkline.js"></script>
    <script src="dist/js/waves.js"></script>
    <script src="dist/js/sidebarmenu.js"></script>
    <script src="dist/js/custom.min.js"></script>

    <!-- 5. Librerías del Calendario (momento + fullcalendar) -->
    <script src="assets/libs/moment/min/moment.min.js"></script>
    <script src="assets/libs/fullcalendar/dist/fullcalendar.min.js"></script>

    <!-- 6. Inicializador del Calendario — ARCHIVO MÁGICO -->
    <script src="dist/js/pages/calendar/cal-init.js"></script>

</body>

</html>
