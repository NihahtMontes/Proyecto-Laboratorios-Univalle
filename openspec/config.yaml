strict_tdd: false
context: |
  Proyecto-Laboratorios-Univalle es una aplicacion ASP.NET Core 9.0 Razor Pages escrita en C#.
  Usa Entity Framework Core 9.0 con SQL Server, EPPlus 7.5.3 y QuestPDF 2025.12.4.
  La solucion contiene el proyecto web; Tools contiene ejecutables net9.0 independientes que deben compilarse por proyecto.
  No se detecto un runner convencional xUnit, NUnit o MSTest. La validacion disponible incluye self-checks y herramientas QA ejecutables; verificar el alcance antes de habilitar TDD estricto.
  Unit tests: none.
  Integration tests: none.
  E2E tests: none.
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: ""
  verify:
    test_command: ""
testing:
  detected: "2026-09-09"
  runner:
    command: ""
    framework: ""
  layers:
    unit: ""
    integration: ""
    e2e: ""
  commands:
    unit:
      []
    integration:
      []
    e2e:
      []
  coverage:
    command: ""
    commands:
      []
quality:
  lint: ""
  lint_commands:
    []
  typecheck: ""
  typecheck_commands:
    []
  format: ""
  format_commands:
    []
